name: build-windows-installer

# exe 只能在 Windows 上冻结，维护者的 macOS 本机做不到——这条流水线就是那台 Windows 机器。
# 载荷一律经 build_windows_installer.py 走 `git archive` 跟踪集导出，不直接打包工作目录：
# 私有 Skill 靠自带 .gitignore 排除出版本库但物理仍在，打目录会外泄。
#
# 检出到 .system/ 子目录而非仓库根：本仓库的路径推导（WORKSPACE_ROOT = SYSTEM_ROOT.parent，
# 见 tools/validate_schema.py、tools/lint_workspace.py 等）统一假设「自己是被安装进某个
# 工作区的 .system/ 目录」——这也是维护者本机与 check_distribution.py 收件方视角重建的真实
# 布局。摊平检出会让这类工具在 CI 里找不到 WORKSPACE_ROOT，制造与本次安装包无关的假失败。

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "rules/**"
      - "entrypoints/**"
      - "templates/**"
      - "schemas/**"
      - "config/**"
      - "skills/**"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .system
    steps:
      - uses: actions/checkout@v4
        with:
          path: .system

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 单元测试门禁
        run: python -m unittest discover -s tests -t .

      - name: 导出控制面载荷（版本库跟踪集）
        run: python tools/build_windows_installer.py --out dist/entropaxis-payload.zip

      - name: 冻结为单文件 exe
        # 构建名保持纯 ASCII：PyInstaller 生成 spec 与中间文件时对非 ASCII 名称并不稳，
        # 面向用户的中文文件名在下一步重命名给出。
        # --add-data 必须给绝对路径：--specpath 把 spec 写到 build/ 后，PyInstaller 会把
        # --add-data 里的相对路径当成"相对 spec 所在目录"解析，而不是相对当前工作目录。
        run: |
          pip install pyinstaller==6.11.1
          $payload = (Resolve-Path "dist/entropaxis-payload.zip").Path
          pyinstaller --onefile --clean --noconfirm `
            --name EntropaxisSetup `
            --add-data "${payload};." `
            --distpath dist --workpath build --specpath build `
            tools/install_windows.py

      - name: 产物自检（实装一次并核对结果）
        shell: pwsh
        run: |
          $exe = "dist/EntropaxisSetup.exe"
          if (-not (Test-Path $exe)) { throw "exe 未生成" }
          # --target 跳过图形选择框，在 CI 内实跑一次安装与初始化
          & $exe --target "$env:RUNNER_TEMP\smoke" --json
          if ($LASTEXITCODE -ne 0) { throw "安装自检失败，退出码 $LASTEXITCODE" }
          foreach ($f in @(".system\tools\bootstrap.py", "AGENTS.md", "CLAUDE.md")) {
            if (-not (Test-Path "$env:RUNNER_TEMP\smoke\$f")) { throw "安装结果缺少 $f" }
          }
          # 幂等重入：同一目录再装一次即升级路径，不得因已存在而失败
          & $exe --target "$env:RUNNER_TEMP\smoke" --json
          if ($LASTEXITCODE -ne 0) { throw "升级路径自检失败，退出码 $LASTEXITCODE" }
          Write-Host "✅ 安装与升级自检通过"

      - name: 重命名为面向用户的中文文件名
        shell: pwsh
        run: Rename-Item dist/EntropaxisSetup.exe "Entropaxis安装程序.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: entropaxis-windows-installer
          path: .system/dist/Entropaxis安装程序.exe
          if-no-files-found: error
          retention-days: 90

      - name: 发布/更新 GitHub Release（latest 滚动标签）
        # Actions artifact 只出现在 Actions 标签页且会过期；侧边栏 Releases 栏要靠 Release
        # 资产。用仓库自带的 gh CLI 直接发布，不为此引入第三方 Action。
        # 只在真正的 main 构建上发布：手动 dispatch 到别的分支自检时不该顶掉线上"最新"。
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R $env:GITHUB_REPOSITORY 2>&1 | Out-Null
          gh release create latest "dist/Entropaxis安装程序.exe" `
            -R $env:GITHUB_REPOSITORY `
            --title "Entropaxis Windows 安装程序（最新）" `
            --notes "自动构建，随 main 分支控制面内容滚动更新；载荷取自本次构建时的版本库跟踪集。构建：${{ github.sha }}" `
            --latest
