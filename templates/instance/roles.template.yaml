_meta:
  source: .entropaxis/templates/instance/roles.template.yaml
  managed_by: bootstrap.py render_instance_configs（仅缺失时渲染）+ setup_agents.py --set-role + 人工
  policy: merge-only
  schema: .entropaxis/schemas/roles_config.schema.json
  note: preferences 从 1 起按序尝试；agent/model 为调用真源，provider 前缀原样保留。profile 为 null 表示尚未选择外置偏好；bootstrap 只做本地检测，真实模型调用须另获用户授权。Reviewer/Maintainer 硬门禁不因空选择而放宽。
default_dispatch_mode: strict
roles:
  Architecture: {duty: 顶层架构/技术选型/方案设计, preferences: [architecture-primary], profile: null}
  Researcher: {duty: 调研（强制联网）/文献综述/竞品查新, preferences: [researcher-primary, researcher-fallback], profile: null}
  Designer: {duty: 视觉美学/UI交互原型/排版呈现, preferences: [designer-primary], profile: null}
  Builder: {duty: 方案实施/核心编码/重构, preferences: [builder-primary, builder-fallback], profile: null}
  Reviewer: {duty: 方案审计/对抗评审/架构合规, preferences: [reviewer-primary, reviewer-fallback, reviewer-fallback-2], profile: null}
  Maintainer: {duty: 全流程验收/守门落盘/证据核验, preferences: [maintainer-primary], profile: null}
  Reporter: {duty: 汇报材料提炼/交付总结, preferences: [reporter-primary, reporter-fallback], profile: null}
command_profiles:
  architecture-primary: {agent: claude, model: claude-opus-5.5, timeout_s: 900}
  researcher-primary: {agent: omp, model: google-antigravity/gemini-3.8-flash, timeout_s: 900}
  researcher-fallback: {agent: omp, model: minimax-code-cn/MiniMax-M3, timeout_s: 900}
  designer-primary: {agent: claude, model: claude-sonnet-5.5, timeout_s: 900}
  builder-primary: {agent: omp, model: zhipu-coding-plan/glm-5.3, timeout_s: 3600}
  builder-fallback: {agent: claude, model: claude-sonnet-5.5, timeout_s: 3600}
  reviewer-primary: {agent: omp, model: openai-codex/gpt-6.1-sol, timeout_s: 1800}
  reviewer-fallback: {agent: omp, model: zhipu-coding-plan/glm-5.3, timeout_s: 1800}
  reviewer-fallback-2: {agent: claude, model: claude-opus-5.5, timeout_s: 1800}
  maintainer-primary: {agent: claude, model: claude-opus-5.5, timeout_s: 900}
  reporter-primary: {agent: omp, model: google-antigravity/gemini-3.8-flash, timeout_s: 900}
  reporter-fallback: {agent: omp, model: minimax-code-cn/MiniMax-M3, timeout_s: 900}
  builder-verify:
    argv: [python3, -m, pytest, -q]
    timeout_s: 600
    note: 自定义校验命令；不含任务占位符，在任务 cwd 执行。
dispatch_authorizations: []
